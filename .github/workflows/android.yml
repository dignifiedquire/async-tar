name: Android xattr regression
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # Keep default xattr support enabled: disabling it hides the regression.
      - run: cargo check --target aarch64-linux-android --lib
