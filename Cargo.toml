[package]
name = "async-tar"
version = "0.6.2"
authors = ["dignifiedquire <me@dignifiequire.com>", "Alex Crichton <alex@alexcrichton.com>"]
repository = "https://github.com/dignifiedquire/async-tar"
documentation = "https://docs.rs/async-tar"
license = "MIT/Apache-2.0"
keywords = ["tar", "tarfile", "encoding"]
readme = "README.md"
edition = "2024"
rust-version = "1.85"

description = """
A Rust implementation of an async TAR file reader and writer. This library does not
currently handle compression, but it is abstract over all I/O readers and
writers. Additionally, great lengths are taken to ensure that the entire
contents are never required to be entirely resident in memory all at once.
"""

[dependencies]
async-fs = { version = "2.2", optional = true }
futures-lite = { version = "2.6", optional = true }
blocking = { version = "1.6", optional = true }
tokio = { version = "1.49", optional = true, features = ["fs", "io-util", "rt"] }
tokio-stream = { version = "0.1.18", features = ["fs"], optional = true }
futures-core = "0.3.31"

[dev-dependencies]
macro_rules_attribute = "0.2"
smol = "2.0"
smol-macros = "0.1"
tokio = { version = "1.49", features = ["rt", "io-std", "rt-multi-thread", "macros"] }
static_assertions = "1.1"
tempfile = "3.24"

[target."cfg(unix)".dependencies]
libc = "0.2"
xattr = { version = "1.6", optional = true }

[target.'cfg(target_os = "redox")'.dependencies]
redox_syscall = "0.9"

[lints.rust]
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[lints.clippy]
absolute_paths = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
manual_let_else = "warn"
or_fun_call = "warn"
unused_async = "warn"
unwrap_used = "warn"
use_self = "warn"

[features]
default = ["xattr", "runtime-smol"]
runtime-smol = ["async-fs", "futures-lite", "blocking"]
runtime-tokio = ["tokio", "tokio-stream"]
